server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # 高德地图 JS API 需要加载其脚本、瓦片与样式，并使用 Web Worker
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.amap.com https://*.is.autonavi.com; style-src 'self' 'unsafe-inline' https://*.amap.com; script-src 'self' 'unsafe-eval' https://*.amap.com; connect-src 'self' https://*.amap.com https://*.is.autonavi.com; worker-src 'self' blob:; font-src 'self' data:" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 带哈希的静态资源长期缓存
    # 注意：location 内不要再写 add_header，否则会覆盖上面 server 级的安全响应头
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # 前端路由
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
